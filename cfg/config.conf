server {
    listen 127.0.0.1:3050;

    root /home/mradouan/correctionFolder/webserv;
    methods GET;
    error_page 400 /errors/400.html;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 504 /errors/504.html;
    autoindex on;

    location / {
        client_max_body_size 50m;
        methods GET POST DELETE;
        index index.html;
        error_page 500 /errors/500.html;
        error_page 400 /errors/400.html;
        upload_path /upload;
        root /home/mradouan/correctionFolder/webserv;
        cgi_data .php /usr/bin/php-cgi;
        cgi_data .py /usr/bin/python3;
        cgi_data .pl /usr/bin/perl;
        autoindex on;
    }

    location /upload {
        methods POST GET;
        upload_path /;
    }

    location /portf {
        authInfo /portf/html/login.html /portf/html/index.html /portf/html/myProjects.html;
        methods GET;
        upload_path /html;
        index index.html;
        error_page 400 /errors/400.html;
        error_page 404 /errors/404.html;
        root /home/mradouan/correctionFolder/portf;
        cgi_data .py /usr/bin/python3;
        autoindex on;
    }

    location /google {
        root /;
        return 302 /google;
    }

}


host 127.0.0.1
