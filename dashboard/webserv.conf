server {
    listen 8080;
    server_name yadib_server;
    host 127.0.0.1;
    
    client_max_body_size 15M;
    
    # Root directory for the dashboard
    root ./dashboard;
    index index.html;

    # Static GET/POST routes
    location / {
        allow_methods GET;
        autoindex on;
    }

    # API route handling uploads


    # Delete module testing
    location /uploads/ {
        allow_methods GET DELETE;
    }

    # CGI Execution configuration
    location /cgi-bin/ {
        allow_methods GET POST;
        cgi_ext .pl /usr/bin/perl;
        cgi_ext .py /usr/bin/python3;
    }
    
    # Redirects
    location /redirect {
        return 301 http://localhost:8080/index.html;
    }
}