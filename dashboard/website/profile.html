<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #2d3748;
            margin-bottom: 20px;
            text-align: center;
        }
        .profile-detail {
            border-bottom: 1px solid #edf2f7;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
        }
        .label {
            color: #718096;
            font-weight: 500;
        }
        .val {
            color: #2d3748;
            font-weight: 600;
        }
        .btn-container {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            text-align: center;
        }
        .btn-back {
            background-color: #edf2f7;
            color: #4a5568;
        }
        .btn-back:hover {
            background-color: #e2e8f0;
        }
        .btn-danger {
            background-color: #fed7d7;
            color: #c53030;
        }
        .btn-danger:hover {
            background-color: #ffebeb;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2>Profile Details</h2>
        
        <div class="profile-detail">
            <span class="label">Status</span>
            <span class="val" style="color: #48bb78;">Active</span>
        </div>
        <div class="profile-detail">
            <span class="label">Email Address</span>
            <span class="val" id="profileEmail">Loading...</span>
        </div>
        <div class="profile-detail">
            <span class="label">Role</span>
            <span class="val">Administrator</span>
        </div>

        <div class="btn-container">
            <button class="btn btn-back" onclick="goBack()">Back to Dashboard</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        // Simple Route Guard
        const email = localStorage.getItem('userEmail');
        if (!email) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('profileEmail').textContent = email;
        }

        function goBack() {
            window.location.href = 'dashboard.html';
        }

        function logout() {
    // Remove the user's email from localStorage
    localStorage.removeItem('userEmail');
    
    // Remove the session ID (choose the one that matches where you stored it)
    localStorage.removeItem('sessionId'); 
    // sessionStorage.removeItem('sessionId'); // Use this if it was stored in sessionStorage instead
    
    // Redirect the user to the login page
    window.location.href = 'login.html';
}
    </script>
</body>
</html>
