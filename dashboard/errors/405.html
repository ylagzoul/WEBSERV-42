<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>405 Method Not Allowed</title>

    body {
      font-family: sans-serif;
      text-align: center;
      padding: 80px 20px;
      background: #f5f5f5;
      color: #333;
    }
    h1 { font-size: 72px; margin: 0; color: #222; }
